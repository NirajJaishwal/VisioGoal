[project]
name = "football-intel-backend"
version = "0.1.0"
description = "FastAPI backend + RAG subsystem for the Football Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "groq>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# EXE002 ("file is executable but no shebang is present") fires on every file in
# this repo: the Windows Docker bind mount marks all mounted files executable, so
# the rule reports an environment artifact rather than a code problem. Ignoring it
# keeps `ruff check .` usable as a real signal.
ignore = ["EXE002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
